{% extends 'base.html' %}
{% load static %}

{% block title %}Password Updated — Sanalogx{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container py-5 text-center">
        <div class="max-width-600 mx-auto auth-card p-5 bg-white shadow-lg border-top border-5 border-success">
            <div class="card-icon-wrapper mx-auto mb-4" style="width: 72px; height: 72px; font-size: 2.2rem; background: #D1FAE5; color: #059669;">
                <i class="fas fa-check-double"></i>
            </div>

            <span class="badge badge-soft-success fs-6 mb-3 px-3 py-2">
                <i class="fas fa-check me-1"></i> UPDATE SUCCESSFUL
            </span>

            <h2 class="fw-bold text-navy mb-3">Password Updated!</h2>
            
            <p class="text-secondary fs-6 mb-4">
                Your password has been changed successfully. You can now use your new credentials to log in.
            </p>

            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'pharmacist_login' %}" class="btn btn-medivault-primary px-4">
                    <i class="fas fa-right-to-bracket me-2"></i> Go to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
