<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invalid Request Link — Sanalogx Pharmacy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #F8FAFC; padding: 3rem 1rem; }
    </style>
</head>
<body>
    <div class="container text-center max-width-mobile" style="max-width: 500px;">
        <div class="card p-5 border-0 shadow-lg rounded-4">
            <div class="text-danger mb-3">
                <i class="fas fa-triangle-exclamation fs-1"></i>
            </div>
            <h4 class="fw-bold text-navy mb-2">Invalid or Expired QR Link</h4>
            <p class="text-muted small mb-4">{{ message }}</p>
            <p class="text-muted extra-small mb-0">Please request assistance at the hospital pharmacy counter.</p>
        </div>
    </div>
</body>
</html>
