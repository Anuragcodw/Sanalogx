{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Supplier — {{ supplier.company_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card card-medivault bg-white shadow-lg p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-navy mb-0"><i class="fas fa-edit text-teal me-2"></i> Edit Supplier: {{ supplier.company_name }}</h4>
                    <a href="{% url 'supplier_detail' supplier.pk %}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Back to Detail</a>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Company Name</label>
                            <input type="text" class="form-control bg-light" value="{{ supplier.company_name }}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Contact Person</label>
                            <input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person }}">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Email Address</label>
                            <input type="email" name="email" class="form-control" value="{{ supplier.email }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Phone Number</label>
                            <input type="text" name="phone" class="form-control" value="{{ supplier.phone }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Address</label>
                        <input type="text" name="address_line1" class="form-control mb-2" value="{{ supplier.address_line1 }}">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <input type="text" name="city" class="form-control" value="{{ supplier.city }}">
                            </div>
                            <div class="col-md-6">
                                <input type="text" name="state" class="form-control" value="{{ supplier.state }}">
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">GST Number</label>
                            <input type="text" name="gst_number" class="form-control" value="{{ supplier.gst_number }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Drug License Number</label>
                            <input type="text" name="drug_license_number" class="form-control" value="{{ supplier.drug_license_number }}">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-muted">Average Delivery Days</label>
                            <input type="number" name="average_delivery_days" min="1" value="{{ supplier.average_delivery_days }}" class="form-control font-monospace fw-bold">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-muted">Payment Terms</label>
                            <select name="payment_terms" class="form-select">
                                {% for code, label in payment_terms %}
                                    <option value="{{ code }}" {% if supplier.payment_terms == code %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-muted">Status</label>
                            <select name="status" class="form-select">
                                {% for code, label in statuses %}
                                    <option value="{{ code }}" {% if supplier.status == code %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-muted">Notes</label>
                        <textarea name="notes" class="form-control" rows="2">{{ supplier.notes }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'supplier_detail' supplier.pk %}" class="btn btn-outline-secondary py-2 px-3">Cancel</a>
                        <button type="submit" class="btn btn-teal text-white py-2 px-4 fw-bold">
                            <i class="fas fa-save me-1"></i> Update Supplier Details
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
