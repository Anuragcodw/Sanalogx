{% extends 'base.html' %}
{% load static %}

{% block title %}404 Page Not Found — Sanalogx{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container py-5 text-center">
        <div class="max-width-600 mx-auto auth-card p-5 bg-white shadow-lg border-top border-5 border-teal">
            <div class="card-icon-wrapper mx-auto mb-4" style="width: 72px; height: 72px; font-size: 2.2rem; background: #E6F6F5; color: #00A896;">
                <i class="fas fa-compass"></i>
            </div>

            <h1 class="display-5 fw-extrabold text-navy mb-2">404</h1>
            <h4 class="fw-bold text-navy mb-3">Page Not Found</h4>
            
            <p class="text-secondary mb-4">
                The page you are looking for does not exist or may have been moved.
            </p>

            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'home' %}" class="btn btn-medivault-primary px-4">
                    <i class="fas fa-house me-2"></i> Return to Sanalogx Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
