<div class="col-sm-6 col-lg-3">
  <div class="inv-kpi-card kpi-c-{{ color|default:'blue' }} h-100">
    <div class="inv-kpi-icon"><i class="fas {{ icon }}"></i></div>
    <div class="inv-kpi-body">
      <div class="inv-kpi-value" data-kpi="{{ value }}">{{ value }}</div>
      <div class="inv-kpi-label">{{ label }}</div>
      <div class="inv-kpi-sub">{{ sub }}</div>
    </div>
  </div>
</div>
